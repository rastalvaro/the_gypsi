<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>The Gypsi — Clean Botanical Skincare</title>
    <meta
      name="description"
      content="Clean, botanical skincare born from a journey across the world's wild places. Real, visible glow — no needles, no compromise."
    />
    <link rel="canonical" href="https://thegypsi.com/" />
    <meta name="theme-color" content="#34412c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preload the LCP hero image (WebP) -->
    <link rel="preload" as="image" href="/img/hero-photo.webp" type="image/webp" fetchpriority="high" />

    <!-- Social share (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Gypsi" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="The Gypsi — Clean Botanical Skincare" />
    <meta
      property="og:description"
      content="Clean, botanical skincare born from a journey across the world's wild places. Real, visible glow — no needles, no compromise."
    />
    <meta property="og:image" content="https://thegypsi.com/og-image.jpg" />
    <meta property="og:image:alt" content="The Gypsi — clean botanical skincare" />
    <meta property="og:url" content="https://thegypsi.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Gypsi — Clean Botanical Skincare" />
    <meta
      name="twitter:description"
      content="Clean, botanical skincare born from a journey across the world's wild places."
    />
    <meta name="twitter:image" content="https://thegypsi.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="The Gypsi — clean botanical skincare" />

    <!-- Structured data: Organization + WebSite (static). Product/ItemList JSON-LD
         is injected between the markers below by scripts/gen-products.mjs at build. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Gypsi",
        "url": "https://thegypsi.com/",
        "logo": "https://thegypsi.com/og-image.jpg",
        "description": "Clean, botanical skincare born from a journey across the world's wild places."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "The Gypsi",
        "url": "https://thegypsi.com/"
      }
    </script>
    <!-- LD-PRODUCTS-BEGIN -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Product",
      "name": "The Miracle Serum",
      "image": "https://thegypsi.com/img/product-serum.jpeg",
      "description": "Face Serum · 30ml",
      "brand": {
        "@type": "Brand",
        "name": "The Gypsi"
      },
      "offers": {
        "@type": "Offer",
        "price": "68.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://thegypsi.com/products/serum.html"
      }
    },
    {
      "@type": "Product",
      "name": "Verdant Mask",
      "image": "https://thegypsi.com/img/product-cleanser.jpeg",
      "description": "Botanical Mask · 100ml",
      "brand": {
        "@type": "Brand",
        "name": "The Gypsi"
      },
      "offers": {
        "@type": "Offer",
        "price": "42.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://thegypsi.com/products/cleanser.html"
      }
    },
    {
      "@type": "Product",
      "name": "Wanderer's Oil",
      "image": "https://thegypsi.com/img/product-oil.jpeg",
      "description": "Face Oil · 30ml",
      "brand": {
        "@type": "Brand",
        "name": "The Gypsi"
      },
      "offers": {
        "@type": "Offer",
        "price": "54.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://thegypsi.com/products/oil.html"
      }
    },
    {
      "@type": "Product",
      "name": "Moonlit Balm",
      "image": "https://thegypsi.com/img/product-cream.jpeg",
      "description": "Night Balm · 50ml",
      "brand": {
        "@type": "Brand",
        "name": "The Gypsi"
      },
      "offers": {
        "@type": "Offer",
        "price": "48.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://thegypsi.com/products/cream.html"
      }
    }
  ]
}
    </script>
    <!-- LD-PRODUCTS-END -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div style="max-width: 720px; margin: 0 auto; padding: 56px 24px; font-family: 'Jost', system-ui, sans-serif; color: #2a3326; line-height: 1.7;">
        <h1>The Gypsi — Clean Botanical Skincare</h1>
        <p>A single golden drop of cold-pressed botanicals. Real, visible glow — no needles, no compromise.</p>
        <p>Our line: The Miracle Serum ($68), Verdant Mask ($42), Wanderer's Oil ($54), Moonlit Balm ($48).</p>
        <p>This site is best experienced with JavaScript enabled — please turn it on to shop and explore.</p>
      </div>
    </noscript>

    <!-- Static form so Netlify can detect & wire up the newsletter (the React
         form posts to it). See src/sections.tsx → Newsletter. -->
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>

    <!-- Snipcart settings node. The key is injected at runtime from VITE_SNIPCART_KEY
         (see src/lib/snipcart.ts). Leave data-api-key empty here. -->
    <div hidden id="snipcart" data-api-key=""></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
