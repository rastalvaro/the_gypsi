<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>The Gypsi — Clean Botanical Skincare</title>
    <meta
      name="description"
      content="Clean, botanical skincare born from a journey across the world's wild places. Real, visible glow — no needles, no compromise."
    />
    <link rel="canonical" href="https://thegypsi.com/" />
    <meta name="theme-color" content="#34412c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preload the LCP hero image. Responsive AVIF preload mirrors the hero <picture>'s
         AVIF <source> (srcset widths + sizes=100vw) so the browser fetches the exact
         candidate it will paint — once, early. Intentionally AVIF-only: adding a second
         type=image/webp preload would make the ~93% of browsers supporting BOTH download
         the hero twice. Non-AVIF browsers (~5%) skip this and fetch the WebP/JPEG from the
         <picture> at paint. Keep widths in sync with scripts/gen-images.mjs + the Hero
         <Picture> in src/sections.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="/img/hero-photo-360.avif 360w, /img/hero-photo-480.avif 480w, /img/hero-photo-660.avif 660w"
      imagesizes="100vw"
    />

    <!-- Social share (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Gypsi" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="The Gypsi — Clean Botanical Skincare" />
    <meta
      property="og:description"
      content="Clean, botanical skincare born from a journey across the world's wild places. Real, visible glow — no needles, no compromise."
    />
    <meta property="og:image" content="https://thegypsi.com/og-image.jpg" />
    <meta property="og:image:alt" content="The Gypsi — clean botanical skincare" />
    <meta property="og:url" content="https://thegypsi.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Gypsi — Clean Botanical Skincare" />
    <meta
      name="twitter:description"
      content="Clean, botanical skincare born from a journey across the world's wild places."
    />
    <meta name="twitter:image" content="https://thegypsi.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="The Gypsi — clean botanical skincare" />

    <!-- Structured data: Organization + WebSite (static). Product/ItemList JSON-LD
         is injected between the markers below by scripts/gen-products.mjs at build. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Gypsi",
        "url": "https://thegypsi.com/",
        "logo": "https://thegypsi.com/og-image.jpg",
        "description": "Clean, botanical skincare born from a journey across the world's wild places."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "The Gypsi",
        "url": "https://thegypsi.com/"
      }
    </script>
    <!-- LD-PRODUCTS-BEGIN -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Product",
      "name": "The Miracle Serum",
      "image": "https://thegypsi.com/img/product-serum.jpeg",
      "description": "Face Serum · 30ml",
      "brand": {
        "@type": "Brand",
        "name": "The Gypsi"
      },
      "offers": {
        "@type": "Offer",
        "price": "68.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://thegypsi.com/products/serum.html"
      }
    },
    {
      "@type": "Product",
      "name": "Verdant Mask",
      "image": "https://thegypsi.com/img/product-cleanser.jpeg",
      "description": "Botanical Mask · 100ml",
      "brand": {
        "@type": "Brand",
        "name": "The Gypsi"
      },
      "offers": {
        "@type": "Offer",
        "price": "42.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://thegypsi.com/products/cleanser.html"
      }
    },
    {
      "@type": "Product",
      "name": "Wanderer's Oil",
      "image": "https://thegypsi.com/img/product-oil.jpeg",
      "description": "Face Oil · 30ml",
      "brand": {
        "@type": "Brand",
        "name": "The Gypsi"
      },
      "offers": {
        "@type": "Offer",
        "price": "54.00",
        "priceCurrency": "USD",

        "url": "https://thegypsi.com/products/oil.html"
      }
    },
    {
      "@type": "Product",
      "name": "Moonlit Balm",
      "image": "https://thegypsi.com/img/product-cream.jpeg",
      "description": "Night Balm · 50ml",
      "brand": {
        "@type": "Brand",
        "name": "The Gypsi"
      },
      "offers": {
        "@type": "Offer",
        "price": "48.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",

  ]
}
    </script>
    <!-- LD-PRODUCTS-END -->

    <!-- Fonts: self-hosted (@font-face in src/index.css, files in public/fonts/) —
         no render-blocking Google Fonts request. Jost is a variable font (one woff2
         covers 300/400/500), so preload just the above-the-fold latin file; Cormorant
         (below the fold) and latin-ext load on demand via font-display: swap. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jost-normal-latin.woff2" crossorigin />

    <!-- The homepage is prerendered into #root at build (scripts/prerender.mjs).
         Sections normally start at .reveal{opacity:0} and fade in via JS; with JS
         disabled that JS never runs, so force the prerendered content visible.
         Inert when JS is enabled, so the scroll-reveal animation is unchanged. -->
    <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
  </head>
  <body>
    <!-- Prerendered at build into this div (scripts/prerender.mjs); the client
         hydrates it (src/main.tsx). Kept empty in source so the prerender step has
         a stable injection target — do not pre-fill it here. -->
    <div id="root"></div>

    <!-- Static form so Netlify can detect & wire up the newsletter (the React
         form posts to it). See src/sections.tsx → Newsletter. -->
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>

    <!-- Snipcart settings node. The key is injected at runtime from VITE_SNIPCART_KEY
         (see src/lib/snipcart.ts). Leave data-api-key empty here. -->
    <div hidden id="snipcart" data-api-key=""></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
