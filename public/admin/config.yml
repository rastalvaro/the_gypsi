backend:
  name: github
  repo: rastalvaro/the_gypsi
  branch: main
  base_url: https://sveltia-cms-auth.ingdimas.workers.dev

media_folder: public/img
public_folder: /img

locale: en

collections:
  - name: products
    label: Products
    files:
      - name: product_list
        label: Products
        file: content/products.json
        fields:
          - name: items
            label: Products
            widget: list
            summary: "{{fields.name}} — ${{fields.price}}"
            fields:
              - label: "ID"
                name: id
                widget: string
                hint: "Unique, lowercase, no spaces. Never change after the product goes live — it's the cart ID and page URL."
              - label: "Name"
                name: name
                widget: string
              - label: "Type"
                name: type
                widget: string
                hint: "e.g. Face Serum · 30ml"
              - label: "Price (USD)"
                name: price
                widget: number
                value_type: float
                min: 0.01
              - label: "Image"
                name: img
                widget: image
                hint: "Upload a JPEG. Responsive image variants are generated separately — the JPEG will display on its own until then."
              - label: "Badge"
                name: tag
                widget: string
                required: false
                default: ""
                hint: "e.g. Bestseller — leave blank for no badge"

  - name: site
    label: "Site Copy"
    files:
      - name: hero
        label: "Hero"
        file: content/hero.json
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Headline
            name: headline
            widget: text
            hint: "Use a new line for each line of the big title"
          - label: Lede
            name: lede
            widget: text
          - label: "Primary button text"
            name: ctaPrimary
            widget: string
          - label: "Secondary button text"
            name: ctaSecondary
            widget: string
          - label: "Hero image"
            name: image
            widget: image

      - name: story
        label: "Founder Story"
        file: content/story.json
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: "Quote (opening text)"
            name: quoteLead
            widget: text
          - label: "Quote (highlighted word/phrase)"
            name: quoteHighlight
            widget: string
          - label: "Quote (closing punctuation)"
            name: quoteTail
            widget: string
          - label: "Body text"
            name: body
            widget: markdown
            hint: "Supports **bold**, *italic*, and [links](https://…). Raw HTML is ignored."
          - label: Image
            name: image
            widget: image

      - name: newsletter
        label: "Newsletter Section"
        file: content/newsletter.json
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Heading
            name: heading
            widget: string
          - label: Body
            name: body
            widget: text

      - name: reviews
        label: "Customer Reviews"
        file: content/reviews.json
        fields:
          - name: items
            label: Reviews
            widget: list
            summary: "{{fields.a}} — {{fields.loc}}"
            fields:
              - label: Quote
                name: q
                widget: text
              - label: "Author name"
                name: a
                widget: string
              - label: Location
                name: loc
                widget: string
              - label: "Stars (1–5)"
                name: r
                widget: number
                value_type: int
                min: 1
                max: 5
                default: 5

      - name: footer
        label: "Footer"
        file: content/footer.json
        fields:
          - label: Tagline
            name: tagline
            widget: text
          - label: Copyright
            name: copyright
            widget: string
          - name: social
            label: "Social & legal links"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: href, widget: string }
          - name: columns
            label: "Footer columns"
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string }
              - name: links
                label: Links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: href, widget: string }

      - name: marquee
        label: "Scrolling ticker"
        file: content/marquee.json
        fields:
          - name: items
            label: Items
            widget: list
            field: { label: Item, name: item, widget: string }

      - name: feature
        label: "Featured product copy"
        file: content/feature.json
        fields:
          - label: "Featured product"
            name: featuredId
            widget: relation
            collection: products
            file: product_list
            value_field: "items.*.id"
            display_fields: ["items.*.name"]
            search_fields: ["items.*.name"]
            hint: "Which product fills the large feature block near the top of the page."
          - label: Description
            name: lede
            widget: text
          - name: bullets
            label: "Benefit bullets"
            widget: list
            field: { label: Bullet, name: bullet, widget: string }
          - label: "Rating text"
            name: rating
            widget: string

      - name: ingredients
        label: "Key Ingredients"
        file: content/ingredients.json
        fields:
          - name: items
            label: Ingredients
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Note, name: note, widget: string }

      - name: ritual
        label: "Ritual Steps"
        file: content/ritual.json
        fields:
          - name: items
            label: Steps
            widget: list
            summary: "{{fields.n}} {{fields.t}}"
            fields:
              - { label: Number, name: n, widget: string, hint: "e.g. 01, 02, 03, 04" }
              - { label: Title, name: t, widget: string }
              - { label: Description, name: d, widget: text }

  - name: theme
    label: "Theme / Colors"
    files:
      - name: palette
        label: "Brand Palette"
        file: content/theme.json
        # A color edit here commits theme.json; the Netlify build regenerates the
        # CSS, so changes go live on the next deploy. Mind contrast — text colors
        # (ink/ink-mute) must stay dark enough on the sand backgrounds for WCAG AA.
        fields:
          - { label: "Sand (page background)", name: sand, widget: color }
          - { label: "Sand deep (alt background)", name: sandDeep, widget: color }
          - { label: "Sand deeper (deep background)", name: sandDeeper, widget: color }
          - { label: "Card", name: card, widget: color }
          - { label: "Ink (main text)", name: ink, widget: color }
          - { label: "Ink soft (secondary text)", name: inkSoft, widget: color }
          - { label: "Ink mute (muted text — keep AA-contrast)", name: inkMute, widget: color }
          - { label: "Line (hairlines/borders)", name: line, widget: color }
          - { label: "Forest", name: forest, widget: color }
          - { label: "Sage", name: sage, widget: color }
          - { label: "Moss (accent)", name: moss, widget: color }
          - { label: "Tan", name: tan, widget: color }
