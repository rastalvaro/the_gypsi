name: Generate responsive image variants

# Runs whenever a master image or content JSON that references images is pushed
# to main (i.e. after a CMS upload). Installs ImageMagick + avifenc, runs
# gen:images, and commits the AVIF/WebP variants back to main.
#
# Infinite-loop guards:
#   1. `if: github.actor != 'github-actions[bot]'` — skips our own commits.
#   2. Commit message contains [skip ci] — GitHub won't trigger any workflow.

on:
  push:
    branches: [main]
    paths:
      - 'public/img/*.jpeg'
      - 'public/img/*.webp'
      - 'content/*.json'
      - 'scripts/gen-images.mjs'

jobs:
  gen-images:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ImageMagick and avifenc
        run: sudo apt-get install -y imagemagick libavif-bin

      - run: npm ci

      - name: Generate AVIF + WebP variants
        run: npm run gen:images

      - name: Commit variants if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/img/
          if git diff --staged --quiet; then
            echo "No new variants — nothing to commit."
          else
            git commit -m "chore: generate responsive image variants [skip ci]"
            git push
          fi
